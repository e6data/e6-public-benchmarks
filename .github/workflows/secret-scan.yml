name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install pinned Gitleaks CLI
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan complete Git history
        run: gitleaks git --redact --no-banner .
